name: Android APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Kaynak ZIP dosyasini ac
        run: unzip -q CARE-LeadScout-Android-Kaynak.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test ve APK derleme
        working-directory: CARE-LeadScout
        run: |
          node tests/extractors.test.cjs
          javac -d /tmp/care-csv app/src/main/java/com/caresoft/leadscout/Csv.java tests/CsvTest.java
          java -cp /tmp/care-csv CsvTest
          gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CARE-LeadScout-APK
          path: CARE-LeadScout/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
